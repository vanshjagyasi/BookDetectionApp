server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — forwards /api/* to the FastAPI backend container.
    # Docker Compose DNS resolves "api" to the backend container IP.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Book detection makes two GPT-4o calls — can take 10-30s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Must match API's MAX_IMAGE_SIZE_MB
        client_max_body_size 25m;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://api:8000/health;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
